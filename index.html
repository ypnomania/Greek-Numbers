<body><main>
<header><h1>Greek Numbers</h1><span id="saveBadge">连接档案…</span></header>
<noscript><p class="notice error">请在支持 JavaScript 的浏览器中打开。</p></noscript>
<div id="notice" class="notice hidden" role="status"></div>
<nav aria-label="训练分类"><button data-tab="number" aria-selected="true">数字</button><button data-tab="phone" aria-selected="false">电话</button><button data-tab="profile" aria-selected="false">档案</button></nav>
<div id="practiceView">
<div id="practiceBody">
<section class="card practice-controls" data-win-title="控制面板">
<div class="grid">
<label>训练方式<select id="regime"><option value="timed">5 秒限时</option><option value="free">自由练习</option></select></label>
<label id="strategyLabel">出题<select id="strategy"><option value="adaptive">自适应</option><option value="diagnostic">单项诊断</option><option value="balanced">位数均衡</option><option value="uniform">完全随机</option><option value="due">到期复习</option></select></label>
<label id="phonePatternLabel" hidden>分组<select id="phonePattern"><option value="pairs">2 + 2 + 2 + 2 + 2</option><option value="triple">3 + 3 + 2 + 2</option><option value="mixed23">2 + 2 + 3 + 3</option><option value="mixed">混合分组</option><option value="digits">逐位基础</option></select></label>
</div>
<details id="settingsPanel"><summary>设置</summary><div class="grid">
<label id="maxLabel">数字范围<select id="max"><option value="99">0–99</option><option value="999">0–999</option><option value="9999">0–9999</option></select></label>
<label>语速<select id="rate"><option value="0.8">0.8×</option><option value="1">1.0×</option><option value="1.2">1.2×</option></select></label>
<label id="groupLabel">单项分组<select id="group"><option value="all">全部</option><option value="个位">个位</option><option value="10–19">10–19</option><option value="整十">整十</option><option value="整百">整百</option><option value="整千">整千</option></select></label>
<label id="ratioLabel">自适应单项比例<select id="unitRatio"><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label>

<label>键盘<select id="keyboard"><option value="pad">页面数字键盘</option><option value="system">系统键盘</option></select></label>
<label>每组题数<select id="goal"><option value="50">50 题</option><option value="100">100 题</option><option value="0">不限</option></select></label>
<label>答对后<select id="autoNext"><option value="650">自动下一题</option><option value="0">手动下一题</option></select></label>
<label id="focusLabel" style="grid-column:1/-1">专项数词<input id="focus" type="text" placeholder="全部" autocomplete="off" aria-describedby="focusFormat"><span id="focusFormat" class="small">用逗号分隔，如 20,50,600。留空练全部。</span></label>
<label style="grid-column:1/-1">希腊语声音<select id="voice"><option value="">查找中…</option></select></label>
</div><div class="row"><button id="refreshVoices">刷新语音</button><button id="clearFocus">清除专项</button></div><div class="row" style="margin-top:8px"><button id="reveal" disabled>显示答案</button><button id="slower" disabled>慢速重听</button></div></details>
<div class="row toolbar"><button id="play" class="primary" disabled>开始</button><button id="pause" disabled>暂停</button><button id="next" disabled>下一题</button></div>
</section>
<section class="card question-card" data-win-title="听写">
<div class="question-bar"><div><span id="questionLabel" class="tag">准备</span><div id="questionMeta" class="small" style="margin-top:4px">0 / 50</div></div><div class="clock" id="clock">—<small>s</small></div></div>
<div id="timeProgress" class="progress"><i></i></div>
<input id="answer" type="text" inputmode="none" readonly enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="—" aria-label="听写答案" aria-invalid="false">
<div id="feedback" class="feedback" aria-live="polite">点击开始</div>
<div class="pad" id="pad" aria-label="数字键盘">
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
<button data-key="clear" class="edit">清空</button><button data-key="0">0</button><button data-key="back" class="edit" aria-label="删除最后一位">⌫</button>
</div>
<div class="live-stats"><span>首答正确<b id="liveFirst">—</b></span><span>1 秒内<b id="liveFast">0</b></span><span>答错<b id="liveWrong">0</b></span><span>超时<b id="liveTimeout">0</b></span></div>
</section>
</div>
<section id="sessionEnd" class="card" data-win-title="结果" hidden><h2>本组完成</h2><div id="sessionMetrics" class="metrics"></div><button id="continueSession" class="primary">再练一组</button></section>
</div>
<div id="profileView" hidden>
<section class="card" data-win-title="学习档案"><div class="row spread"><h2 style="margin:0">学习档案</h2><select id="profileMode" style="width:auto"><option value="number">数字</option><option value="phone">电话</option></select></div><div id="profileCondition" class="small hidden" style="margin-top:6px"></div><div id="profileMetrics" class="metrics"></div><div id="profileExtra" class="small hidden"></div></section>
<section class="card" id="unitSection" data-win-title="单项熟练度"><div class="row spread"><h2 style="margin:0">单项熟练度</h2><select id="unitFilter" style="width:auto"><option value="all">全部</option><option value="个位">个位</option><option value="10–19">10–19</option><option value="整十">整十</option><option value="整百">整百</option><option value="整千">整千</option></select></div><div class="row" style="margin:12px 0"><button id="startDiagnostic" class="primary">单项诊断</button><button id="startDue">到期复习</button><span class="small" id="dueCount"></span></div><div id="units" class="unit-list"></div></section>
<section class="card" data-win-title="近 7 天"><h2>近 7 天</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>题数</th><th>首答</th><th>1s 内</th><th>超时</th></tr></thead><tbody id="dailyRows"></tbody></table></div></section>
<section class="card" data-win-title="输入差异"><h2>输入差异</h2><div id="confusions"></div></section>
<section class="card" data-win-title="最近作答"><h2>最近作答</h2><div id="history"></div></section>
<section class="card" data-win-title="数据"><h2>数据</h2><div id="storageInfo" class="small"></div><div class="row footer-actions"><button id="export">导出备份</button><button id="import">导入备份</button><button id="retrySave" hidden>重试保存</button><button id="reset" class="danger">清空</button></div><input id="importFile" type="file" accept=".json,application/json" hidden></section>
</div>
<div class="version">Greek Numbers 98 · v7</div>
</main>
<script>/* Greek Number Listening v4 — pure domain functions; no DOM or persistence. */
(function (root) {
  'use strict';
  const U = ['μηδέν','ένα','δύο','τρία','τέσσερα','πέντε','έξι','επτά','οκτώ','εννέα'];
  const T = ['','δέκα','είκοσι','τριάντα','σαράντα','πενήντα','εξήντα','εβδομήντα','ογδόντα','ενενήντα'];
  const TEEN = ['δέκα','έντεκα','δώδεκα','δεκατρία','δεκατέσσερα','δεκαπέντε','δεκαέξι','δεκαεπτά','δεκαοκτώ','δεκαεννέα'];
  const H = ['','εκατό','διακόσια','τριακόσια','τετρακόσια','πεντακόσια','εξακόσια','επτακόσια','οκτακόσια','εννιακόσια'];
  const TH = ['','χίλια','δύο χιλιάδες','τρεις χιλιάδες','τέσσερις χιλιάδες','πέντε χιλιάδες','έξι χιλιάδες','επτά χιλιάδες','οκτώ χιλιάδες','εννέα χιλιάδες'];
  function greek(n) {
    if (!Number.isInteger(n) || n < 0 || n > 9999) throw new RangeError('Number must be an integer from 0 to 9999');
    if (n < 10) return U[n];
    if (n < 20) return TEEN[n - 10];
    if (n < 100) return T[Math.floor(n/10)] + (n%10 ? ' ' + U[n%10] : '');
    if (n < 1000) return (Math.floor(n/100) === 1 && n%100 ? 'εκατόν' : H[Math.floor(n/100)]) + (n%100 ? ' ' + greek(n%100) : '');
    return TH[Math.floor(n/1000)] + (n%1000 ? ' ' + greek(n%1000) : '');
  }
  const ATOMS = [];
  const add = (key,group,value) => ATOMS.push(Object.freeze({key,group,value,label:greek(value)}));
  for(let i=0;i<=9;i++) add('o:'+i,'个位',i);
  for(let i=10;i<=19;i++) add('teen:'+i,'10–19',i);
  for(let i=2;i<=9;i++) add('t:'+i,'整十',i*10);
  for(let i=1;i<=9;i++) add('h:'+i,'整百',i*100);
  for(let i=1;i<=9;i++) add('th:'+i,'整千',i*1000);
  const BY_KEY = Object.fromEntries(ATOMS.map(a=>[a.key,a]));
  function components(n) {
    greek(n); // Validate range before decomposition.
    if(n===0) return ['o:0'];
    const keys=[], th=Math.floor(n/1000), h=Math.floor(n%1000/100), tail=n%100;
    if(th) keys.push('th:'+th);
    if(h) keys.push('h:'+h);
    if(tail>=10 && tail<=19) keys.push('teen:'+tail);
    else {if(tail>=20) keys.push('t:'+Math.floor(tail/10)); if(tail%10) keys.push('o:'+tail%10);}
    return keys;
  }
  const PATTERNS = {pairs:[2,2,2,2,2],triple:[3,3,2,2],mixed23:[2,2,3,3]};
  function spokenChunk(s) {
    if(!/^\d{1,3}$/.test(s)) throw new TypeError('Invalid phone chunk');
    // A leading zero is significant in phone dictation. It is never discarded.
    if(s[0]==='0') return U[0] + (s.length>1 ? ' ' + spokenChunk(s.slice(1)) : '');
    return greek(Number(s));

function acceptInput(value,deleted=false,pasted=false){

  const now=performance.now();

  const normalized=normalizeInput(value,q.mode==='phone');
  if(normalized===null){$('answer').value=q.value;feedback('仅输入数字');return;}
  if(q.value===normalized)return;
  if(deleted&&q.value.length)q.edits++;
  if(pasted)q.pasted=true;
  q.inputEvents.push({value:normalized,ms:now-q.firstSpeechStart,kind:deleted?'delete':pasted?'paste':'insert'});

async function initialize(){

    const tx=db.transaction(names,'readonly'),done=transactionDone(tx);

    const [stored,packedRows,oldRows]=await Promise.all([metaReq,compactReq,oldReq]);await done;

    for(const row of packedRows){const e=unpackDBEvent(row);merged.set(e.id,e);}
    for(const raw of oldRows){

    // Rewrite once into the compact store, then clear the old expanded store.
    if(oldRows.length||stored?.schemaVersion!==7){
      const stores=['events7','meta'];if(db.objectStoreNames.contains('events'))stores.push('events');
      const wtx=db.transaction(stores,'readwrite'),wdone=transactionDone(wtx);
      for(const e of events)wtx.objectStore('events7').put(packDBEvent(e));
      if(db.objectStoreNames.contains('events'))wtx.objectStore('events').clear();
      wtx.objectStore('meta').put(meta,'main');
      await wdone;
    }else await writeMeta();

    try{localStorage.removeItem('greekNumberTrainer.profile.v3');}catch{}
    state.ready=true;syncControls();populateVoices();storageStatus();updateUI();
    if(!voices.length)message('未检测到希腊语声音。');
  }catch(err){state.ready=false;state.writeFailed=true;message('档案无法打开：'+err.message,true);storageStatus();updateUI();}
}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>switchTab(b.dataset.tab);
for(const id of ['max','regime','strategy','rate','group','unitRatio','keyboard','goal','autoNext','phonePattern','focus','voice'])$(id).addEventListener('change',changeSettings);
$('refreshVoices').onclick=()=>{populateVoices();message(voices.length?'已找到 '+voices.length+' 个希腊语声音。':'仍未检测到希腊语声音。',!voices.length);};
$('clearFocus').onclick=()=>{$('focus').value='';$('group').value='all';changeSettings();};
$('play').onclick=()=>{if(state.running&&state.q)replay(false);else startSession();};
$('pause').onclick=pause;
$('next').onclick=()=>{if(activeQuestion())finish('skipped');else{if(state.sessionClosed){state.sessionId=uid();state.sessionClosed=false;}state.running=true;nextQuestion();}};
$('reveal').onclick=()=>finish('revealed');$('slower').onclick=()=>replay(true);
$('answer').addEventListener('input',e=>{if(!e.isComposing)acceptInput(e.target.value,String(e.inputType).startsWith('delete'),e.inputType==='insertFromPaste');});
$('answer').addEventListener('compositionend',e=>acceptInput(e.target.value));
$('answer').addEventListener('paste',()=>{if(state.q)state.q.pasted=true;});
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();}});
for(const b of $('pad').querySelectorAll('[data-key]'))b.onclick=()=>keypad(b.dataset.key);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName))return;
  if(settings().keyboard!=='pad'||!canInput())return;
  if(/^\d$/.test(e.key)){e.preventDefault();keypad(e.key);}else if(e.key==='Backspace'){e.preventDefault();keypad('back');}
});
$('continueSession').onclick=()=>{state.sessionId=uid();state.sessionClosed=false;startSession();};
$('profileMode').onchange=renderProfile;$('unitFilter').onchange=renderUnits;
$('startDiagnostic').onclick=async()=>{settings().strategy='diagnostic';settings().focus=[];settings().group=$('unitFilter').value;settings().max=9999;try{await writeMeta();switchTab('number');syncControls();}catch(err){message(err.message,true);}};
$('startDue').onclick=async()=>{settings().strategy='due';settings().focus=[];settings().group='all';settings().max=9999;try{await writeMeta();switchTab('number');syncControls();}catch(err){message(err.message,true);}};
$('export').onclick=exportBackup;$('import').onclick=()=>{pause();$('importFile').click();};
$('importFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);};$('reset').onclick=resetData;$('retrySave').onclick=retrySave;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('pagehide',pause);
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',populateVoices);
initialize();
})();
</script>
</body></html>
